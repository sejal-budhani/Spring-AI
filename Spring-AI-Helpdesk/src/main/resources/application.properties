spring.application.name=Spring-AI-Helpdesk
server.port=8081
# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/spring_ai_helpdesk?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect (optional for Spring Boot 3.x)
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:0.6b
spring.ai.ollama.chat.options.temperature=0.3
logging.level.org.springframework.ai=DEBUG